- name: Install fonts (Cascadia Code and Caskaydia Nerd Font)
  hosts: localhost
  gather_facts: true
  vars:
    fonts_dir: "{{ ansible_env.HOME }}/.fonts"
    cascadia_source: "https://github.com/microsoft/cascadia-code/releases/download/v2111.01/CascadiaCode-2111.01.zip"
    caskaydia_source: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.0/CascadiaCode.zip"
    sandbox: "/tmp/font_install_sandbox"
  tasks:
    - name: Ensure fonts directory exists
      file:
        path: "{{ fonts_dir }}"
        state: directory
        mode: '0755'

    - name: Create sandbox directory
      file:
        path: "{{ sandbox }}"
        state: directory
        mode: '0755'

    # Process Cascadia Code fonts
    - name: Download CascadiaCode zip file
      get_url:
        url: "{{ cascadia_source }}"
        dest: "{{ sandbox }}/CascadiaCode-2111.01.zip"
        mode: '0644'

    - name: Unarchive CascadiaCode zip file
      unarchive:
        src: "{{ sandbox }}/CascadiaCode-2111.01.zip"
        dest: "{{ sandbox }}"
        remote_src: true

    - name: Remove old CascadiaCode TTF files from fonts directory
      file:
        path: "{{ fonts_dir }}/CascadiaCode*.ttf"
        state: absent

    - name: Move new CascadiaCode TTF files to fonts directory
      shell: mv --update ttf/CascadiaCode*.ttf "{{ fonts_dir }}"
      args:
        chdir: "{{ sandbox }}"
      register: move_cascadia
      changed_when: move_cascadia.rc != 0

    - name: Clean sandbox after processing CascadiaCode
      file:
        path: "{{ sandbox }}"
        state: absent

    # Process Caskaydia Nerd Font files
    - name: Download Caskaydia zip file
      get_url:
        url: "{{ caskaydia_source }}"
        dest: "{{ sandbox }}/CascadiaCode.zip"
        mode: '0644'

    - name: Unarchive Caskaydia zip file
      unarchive:
        src: "{{ sandbox }}/CascadiaCode.zip"
        dest: "{{ sandbox }}"
        remote_src: true

    - name: Remove old Caskaydia Nerd Font TTF files from fonts directory
      file:
        path: "{{ fonts_dir }}/CaskaydiaCoveNerdFont*.ttf"
        state: absent

    - name: Move selected Caskaydia Nerd Font files to fonts directory
      shell: mv --update CaskaydiaCoveNerdFont-*.ttf "{{ fonts_dir }}"
      args:
        chdir: "{{ sandbox }}"
      register: move_caskaydia_nerd
      changed_when: move_caskaydia_nerd.rc != 0

    - name: Remove sandbox directory
      file:
        path: "{{ sandbox }}"
        state: absent

    - name: Refresh font cache
      command: fc-cache --force --verbose
      register: refresh_font_cache
      changed_when: refresh_font_cache.rc != 0
