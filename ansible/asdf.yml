- name: Install asdf version manager and plugins
  hosts: localhost
  become: false
  vars:
    local_bin_path: "{{ ansible_env.HOME | default('/home/axl') }}/.local/bin"
    asdf_version: "v0.16.1"
    asdf_archive: "asdf-{{ asdf_version }}-linux-amd64.tar.gz"
    asdf_url: "https://github.com/asdf-vm/asdf/releases/download/{{ asdf_version }}/{{ asdf_archive }}"
    asdf_plugins:
      - bat
      - choose
      - dive
      - elixir
      - erlang
      - eza
      - fd
      - fzf
      - github-cli
      - jq
      - julia
      - neovim
      - nodejs
      - pipx
      - ripgrep
      - ruff
      - shellcheck
      - uv
      - yq

  tasks:
    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ local_bin_path }}"
        state: directory
        mode: '0755'
      tags: setup

    - name: Download asdf binary
      ansible.builtin.get_url:
        url: "{{ asdf_url }}"
        dest: "{{ ansible_env.HOME | default('/home/axl') }}/{{ asdf_archive }}"
        mode: '0644'
      tags: setup

    - name: Extract asdf binary
      ansible.builtin.unarchive:
        src: "{{ ansible_env.HOME | default('/home/axl') }}/{{ asdf_archive }}"
        dest: "{{ local_bin_path }}"
        remote_src: false
      tags: setup

    - name: Move asdf binary to local bin
      ansible.builtin.command:
        cmd: mv "{{ local_bin_path }}/asdf-{{ asdf_version }}/asdf" "{{ local_bin_path }}/"
      args:
        creates: "{{ local_bin_path }}/asdf"
      tags: setup

    - name: Ensure asdf binary is executable
      ansible.builtin.file:
        path: "{{ local_bin_path }}/asdf"
        mode: '0755'
      tags: setup

    - name: Remove asdf archive after extraction
      ansible.builtin.file:
        path: "{{ ansible_env.HOME | default('/home/axl') }}/{{ asdf_archive }}"
        state: absent
      tags: cleanup

    - name: Ensure asdf is in PATH
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME | default('/home/axl') }}/.bashrc"
        line: |
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/.asdf/shims:$PATH"
        mode: '0644'
      tags: setup

    - name: Install asdf plugins
      block:
        - name: Add asdf plugins
          ansible.builtin.shell: |
            export PATH="$HOME/.local/bin:$PATH"
            export PATH="$HOME/.asdf/shims:$PATH"
            asdf plugin add {{ item }} || true
          args:
            executable: /bin/bash
          register: add_plugin_result
          changed_when: add_plugin_result.rc == 0
          loop: "{{ asdf_plugins }}"
          tags: plugins

        - name: Install latest version of plugins
          ansible.builtin.shell: |
            export PATH="$HOME/.local/bin:$PATH"
            export PATH="$HOME/.asdf/shims:$PATH"
            asdf install {{ item }} latest
          args:
            executable: /bin/bash
          register: install_plugin_result
          changed_when: install_plugin_result.rc == 0
          loop: "{{ asdf_plugins }}"
          tags: plugins
