- name: Install z script if not already executable
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    bin_dir: "{{ ansible_env.HOME }}/.local/bin"
    sandbox: "/tmp/z_install"
  tasks:
    - name: Ensure bin directory exists
      file:
        path: "{{ bin_dir }}"
        state: directory
        mode: '0755'

    - name: Check if z.sh exists and is executable in the bin directory
      stat:
        path: "{{ bin_dir }}/z.sh"
      register: z_sh_stat

    - name: Install z if not present or not executable
      block:
        - name: Create sandbox directory
          file:
            path: "{{ sandbox }}"
            state: directory

        - name: Download z.sh from GitHub into sandbox
          get_url:
            url: "https://raw.githubusercontent.com/rupa/z/master/z.sh"
            dest: "{{ sandbox }}/z.sh"
            mode: '0644'

        - name: Move z.sh to bin directory
          command: mv "{{ sandbox }}/z.sh" "{{ bin_dir }}/z.sh"

        - name: Set executable permission on z.sh in bin directory
          file:
            path: "{{ bin_dir }}/z.sh"
            mode: '0755'

        - name: Clean up sandbox directory
          file:
            path: "{{ sandbox }}"
            state: absent
      when: not (z_sh_stat.stat.exists and ((z_sh_stat.stat.mode | int(base=8)) & 64))
