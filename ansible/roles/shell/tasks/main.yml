---
- name: Configure tmux plugin manager
  block:
    - name: Create tmux plugins directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.tmux/plugins"
        state: directory
        mode: '0755'
        
    - name: Clone tmux plugin manager
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "{{ ansible_env.HOME }}/.tmux/plugins/tpm"
        force: true
  failed_when: false

- name: Install vim-plug for neovim
  block:
    - name: Create neovim autoload directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/share/nvim/site/autoload"
        state: directory
        mode: '0755'

    - name: Download vim-plug
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: "{{ ansible_env.HOME }}/.local/share/nvim/site/autoload/plug.vim"
        mode: '0644'
        force: false
  failed_when: false

