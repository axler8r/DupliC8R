---
- name: Create fonts directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.fonts"
    state: directory
    mode: '0755'

- name: Download and install Cascadia Code fonts
  ansible.builtin.unarchive:
    src: https://github.com/microsoft/cascadia-code/releases/download/v2407.24/CascadiaCode-2407.24.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/ttf

- name: Install Cascadia Code fonts
  ansible.builtin.copy:
    src: "/tmp/ttf/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.fonts/"
    mode: '0644'
  with_fileglob:
    - "/tmp/ttf/CascadiaCode*.ttf"
  failed_when: false

- name: Update font cache
  ansible.builtin.command: fc-cache -fv
  changed_when: false
