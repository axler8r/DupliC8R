- name: Install GNU parallel from source
  hosts: localhost
  become: false
  gather_facts: true
  vars:
    work_dir: "/tmp/parallel_install"
    parallel_url: "https://ftp.gnu.org/gnu/parallel/parallel-latest.tar.bz2"
    install_prefix: "{{ ansible_env.HOME }}/.local"
  tasks:
    - name: Create working directory
      file:
        path: "{{ work_dir }}"
        state: directory
        mode: '0755'

    - name: Download GNU parallel tarball
      get_url:
        url: "{{ parallel_url }}"
        dest: "{{ work_dir }}/parallel-latest.tar.bz2"
        mode: '0644'

    - name: Extract GNU parallel tarball
      unarchive:
        src: "{{ work_dir }}/parallel-latest.tar.bz2"
        dest: "{{ work_dir }}"
        remote_src: true

    - name: Find extracted GNU parallel directory
      shell: |
        set -o pipefail
        ls -d {{ work_dir }}/parallel-* | head -n 1
      register: parallel_src_dir
      changed_when: false

    - name: Run ./configure with custom prefix
      command: "./configure --prefix={{ install_prefix }}"
      args:
        chdir: "{{ parallel_src_dir.stdout }}"
      register: configure_output
      changed_when: configure_output.rc != 0

    - name: Build GNU parallel
      command: "make"
      args:
        chdir: "{{ parallel_src_dir.stdout }}"
      register: build_output
      changed_when: build_output.rc != 0

    - name: Install GNU parallel
      command: "make install"
      args:
        chdir: "{{ parallel_src_dir.stdout }}"
      register: install_output
      changed_when: install_output.rc != 0

    - name: Remove extracted GNU parallel directory
      file:
        path: "{{ parallel_src_dir.stdout }}"
        state: absent
